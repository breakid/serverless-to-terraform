# cspell: disable

[project]
  dependencies    = ["jinja2>=3.1.6", "loguru>=0.7.3", "pyyaml>=6.0.2", "uv>=0.6.14"]
  description     = "A Python application that parses a Serverless Framework config file and generates Terraform config files for the associated resources."
  name            = "serverless"
  readme          = "README.md"
  requires-python = ">=3.12"
  version         = "0.1.0"

[dependency-groups]
  dev = ["pre-commit>=4.2.0", "ruff>=0.11.5", "types-jinja2>=2.11.9", "types-pyyaml>=6.0.12.20250402"]


# ============================================================================ #
#                                     Ruff                                     #
# ============================================================================ #
#
# Reference:
#   - [Configuration](https://docs.astral.sh/ruff/configuration/)
#
#   - [Settings](https://docs.astral.sh/ruff/settings)
#   - [Rules](https://docs.astral.sh/ruff/rules/)
#
[tool.ruff]

  # Default: Exclude a variety of commonly ignored directories
  exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
  ]

  extend-exclude = []

  # Set the maximum line length to 120
  # Reference: https://knox.codes/posts/line-length-limits
  line-length = 120

  # Target Python 3.12
  target-version = "py312"

[tool.ruff.lint]
  select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C",    # mccabe (complexity)
    "C4",   # flake8-comprehensions
    "COM",  # flake8-commas
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle (errors)
    "EM",   # flake8-errmsg
    "ERA",  # eradicate
    "EXE",  # flake8-executable
    "F",    # Pyflakes
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "ISC",  # flake8-implicit-str-concat
    "N",    # pep8-naming
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # Pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "UP",   # pyupgrade
    "W",    # pycodestyle (warnings)
    # "TD",   # flake8-todos
  ]

  # extend-select = []  # Default setting

  # ignore:
  ignore = [
    "ANN401", # Unused type annotation; ignored for compatibility with the Ruff formatter
    "ARG001", # Unused argument; ignored for compatibility with the Ruff formatter
    "COM812", # Trailing comma missing; ignored for compatibility with the Ruff formatter
    "ERA001", # Eradicate: Unused code detected; ignored for compatibility with the Ruff formatter
    "ISC001", # Implicitly concatenated string literals on one line; ignored for compatibility with the Ruff formatter
  ]

  # Allow fix for all enabled rules (when `--fix`) is provided.
  # fixable   = ["ALL"] # Default setting
  # unfixable = []      # Default setting

  # Allow unused variables when underscore-prefixed.
  # dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$" # Default setting

[tool.ruff.lint.isort]

  # Each import should be on a separate line to minimize merge conflicts (see
  # [reorder_python_imports](https://github.com/asottile/reorder_python_imports#why-this-style)).
  force-single-line = true
  known-first-party = ["my-app"]

  # Unsupported Options (as of 2024-06-20):
  #   import_headings   = { stdlib = "Standard Libraries", thirdparty = "Third-party Libraries", firstparty = "Internal Libraries" }

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
  "tests/**" = [
    "E402",
    "S101", # Use of `assert`
  ]
  "tests/**/conftest.py" = [
    "F401", # '[module]' imported but unused
  ]

[tool.ruff.lint.pydocstyle]
  # Use Google-style docstrings (https://sphinxcontrib-napoleon.readthedocs.io/en/latest/example_google.html).
  convention = "google"

[tool.ruff.format]
  # Like Black, use double quotes for strings.
  # quote-style = "double" # Default setting

  # Like Black, indent with spaces, rather than tabs.
  # indent-style = "space" # Default setting

  # Like Black, respect magic trailing commas.
  # skip-magic-trailing-comma = false # Default setting

  # Like Black, automatically detect the appropriate line ending.
  # line-ending = "auto" # Default setting

  # Enable auto-formatting of code examples in docstrings. Markdown,
  # reStructuredText code/literal blocks and doctests are all supported.
  docstring-code-format = true

  # Set the line length limit used when formatting code snippets in
  # docstrings.
  #
  # This only has an effect when the `docstring-code-format` setting is
  # enabled.
  # docstring-code-line-length = "dynamic" # Default setting


# ============================================================================ #
#                                     isort                                    #
# ============================================================================ #
#
# Note: As of 2024-06-20, Ruff can do every listed here, with the exception of setting the `import_headings`. Keeping
# isort for now to handle continuous formatting, and using Ruff as a pre-commit and CI pipeline check
#
[tool.isort]
  # Reference: https://pycqa.github.io/isort/docs/configuration/options.html
  atomic                                  = true
  force_alphabetical_sort_within_sections = true

  # Each import should be on a separate line to minimize merge conflicts (see
  # [reorder_python_imports](https://github.com/asottile/reorder_python_imports#why-this-style)).
  force_single_line = true
  import_headings   = { stdlib = "Standard Libraries", thirdparty = "Third-party Libraries", firstparty = "Internal Libraries" }
  known_first_party = ["core", "models", "sql"]

  # This value must match the `line-length` option for `black`
  line_length = 120
  profile     = "black"


# ============================================================================ #
#                                     MyPy                                     #
# ============================================================================ #
#
[tool.mypy]
  check_untyped_defs          = true
  disallow_any_generics       = true
  disallow_incomplete_defs    = true
  disallow_untyped_calls      = true
  disallow_untyped_decorators = true
  disallow_untyped_defs       = true
  no_implicit_optional        = true
  strict                      = true
  strict_equality             = true
  warn_no_return              = true
  warn_redundant_casts        = true
  warn_return_any             = true
  warn_unreachable            = true

  exclude = []
